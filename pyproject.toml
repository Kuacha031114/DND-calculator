[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chizhong-dnd-calculator"
version = "3.2.0"
description = "池中社 DND 5e 2014 攻击与伤害结算器"
readme = "readme.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Duan Haozhe" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.gui-scripts]
dnd-calculator = "dnd_calculator.ui:main"

[project.optional-dependencies]
build = ["pyinstaller==6.22.0"]
dev = ["coverage[toml]>=7.6,<8", "ruff>=0.9,<1"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["dnd_calculator"]
omit = ["*/__main__.py", "*/advanced_ui.py", "*/analysis_ui.py", "*/quick_ui.py", "*/ui.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
exclude = ["池中社DND战斗计算器v2.0正式版.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
