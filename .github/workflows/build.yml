name: test-and-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m coverage run -m unittest discover -s tests -v
        env:
          DND_TK_SMOKE: "1"
      - run: python -m coverage report

  build:
    needs: test
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[build]"
      - name: Verify Tk runtime
        run: python -c "import tkinter; assert tkinter.TkVersion >= 8.6; print('Tk', tkinter.TkVersion)"
      - run: pyinstaller --clean --noconfirm dnd_calculator.spec
      - name: Verify Windows executable and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifact = Get-ChildItem dist/*.exe | Select-Object -First 1
          $bytes = [System.IO.File]::ReadAllBytes($artifact.FullName)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Invalid Windows executable" }
          $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($artifact.Name)" | Set-Content -Encoding ascii "$($artifact.FullName).sha256"
      - name: Package macOS app as zip
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/池中社DND战斗计算器v3.2.0.app" "dist/DND.v3.2.0-macOS.zip"
      - name: Verify macOS application and checksum
        if: runner.os == 'macOS'
        run: |
          test -d "dist/池中社DND战斗计算器v3.2.0.app"
          plutil -lint "dist/池中社DND战斗计算器v3.2.0.app/Contents/Info.plist"
          unzip -t "dist/DND.v3.2.0-macOS.zip"
          cd dist
          shasum -a 256 "DND.v3.2.0-macOS.zip" > "DND.v3.2.0-macOS.zip.sha256"
      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dnd-calculator-Windows
          path: |
            dist/*.exe
            dist/*.exe.sha256
      - name: Upload macOS zip
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: dnd-calculator-macOS
          path: |
            dist/*.zip
            dist/*.zip.sha256
