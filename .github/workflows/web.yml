name: web-test-and-deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/dnd_calculator/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "src/dnd_calculator/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Python quality and build tools
        run: python -m pip install -e ".[dev]" build
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint Python
        run: python -m ruff check src tests
      - name: Run Python tests with coverage
        env:
          PYTHONPATH: src
        run: python -m coverage run -m unittest discover -s tests -v && python -m coverage report
      - name: Build pure Python wheel
        run: python -m build --wheel --outdir dist-web
      - name: Prepare self-hosted Python runtime
        working-directory: web
        run: pnpm prepare-runtime
      - name: Type-check web app
        working-directory: web
        run: pnpm typecheck
      - name: Run web unit tests with coverage
        working-directory: web
        run: pnpm test:coverage
      - name: Build PWA
        working-directory: web
        run: pnpm build
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser smoke tests
        working-directory: web
        run: pnpm test:e2e:prebuilt
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: check-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
